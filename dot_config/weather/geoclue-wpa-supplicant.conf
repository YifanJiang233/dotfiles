<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- GeoClue's Wi-Fi source runs as this dedicated system user. Permit only
       bulk property reads, scan requests and the signals needed to track scan
       results. D-Bus cannot filter GetAll by its interface argument, so this
       is the narrowest policy compatible with GeoClue's generated proxies.
       Property writes and every network-management method remain denied. -->
  <policy user="geoclue">
    <allow send_destination="fi.w1.wpa_supplicant1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"
           send_type="method_call"/>
    <allow send_destination="fi.w1.wpa_supplicant1"
           send_interface="fi.w1.wpa_supplicant1.Interface"
           send_member="Scan"
           send_type="method_call"/>

    <allow receive_sender="fi.w1.wpa_supplicant1"
           receive_interface="org.freedesktop.DBus.Properties"
           receive_member="PropertiesChanged"
           receive_type="signal"/>
    <allow receive_sender="fi.w1.wpa_supplicant1"
           receive_interface="fi.w1.wpa_supplicant1"
           receive_member="InterfaceAdded"
           receive_type="signal"/>
    <allow receive_sender="fi.w1.wpa_supplicant1"
           receive_interface="fi.w1.wpa_supplicant1"
           receive_member="InterfaceRemoved"
           receive_type="signal"/>
    <allow receive_sender="fi.w1.wpa_supplicant1"
           receive_interface="fi.w1.wpa_supplicant1.Interface"
           receive_member="BSSAdded"
           receive_type="signal"/>
    <allow receive_sender="fi.w1.wpa_supplicant1"
           receive_interface="fi.w1.wpa_supplicant1.Interface"
           receive_member="BSSRemoved"
           receive_type="signal"/>
    <allow receive_sender="fi.w1.wpa_supplicant1"
           receive_interface="fi.w1.wpa_supplicant1.Interface"
           receive_member="ScanDone"
           receive_type="signal"/>
  </policy>
</busconfig>
